services:
  - type: web
    name: trac-nghiem-backend
    runtime: node
    plan: free
    # rootDir không phải lúc nào cũng được Blueprint áp dụng đúng,
    # nên ta dùng 2 script ở root để cd vào folder backend.
    buildCommand: bash ./build.sh
    startCommand: bash ./start.sh
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set trên dashboard Render, lấy từ Supabase
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false   # ví dụ: https://<user>.github.io
