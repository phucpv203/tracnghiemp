services:
  - type: web
    name: trac-nghiem-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # set trên dashboard Render, lấy từ Supabase
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false   # ví dụ: https://<user>.github.io
