services:
  - type: web
    name: trac-nghiem-backend
    runtime: node
    plan: free
    # Render sẽ tự detect Node từ package.json ở root.
    # Script "start" trong root package.json sẽ cd vào backend/ rồi chạy node index.js.
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
